[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wardbreaker"
version = "0.1.0"
description = "A local fuzzer for open-weight LLM guardrails: measures per-family bypass rate and over-blocking, with a downstream-model check that filters fake bypasses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali Mehdi Jafeeri" }]
keywords = ["llm", "guardrails", "red-teaming", "ai-safety", "llama-guard", "prompt-guard", "security", "fuzzing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core is zero-dependency: stdlib only, talks to Ollama over HTTP

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch>=2.0"]  # only needed for the Prompt Guard target
dev = ["pytest>=7", "ruff>=0.5"]
docs = ["matplotlib>=3.5"]  # only needed to regenerate docs/bypass_gap.png

[project.urls]
Homepage = "https://github.com/jafeeri/wardbreaker"
Repository = "https://github.com/jafeeri/wardbreaker"
Issues = "https://github.com/jafeeri/wardbreaker/issues"

[project.scripts]
wardbreaker = "wardbreaker.cli:main"

[tool.setuptools.packages.find]
include = ["wardbreaker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long data/documentation strings are intentional
